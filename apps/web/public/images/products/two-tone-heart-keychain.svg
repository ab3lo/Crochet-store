<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Two-tone heart keychain">
  <defs>
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
    <linearGradient id="wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#F7DDE4"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
  </defs>

  <style>
    /* System stack: these are placeholders, not a font delivery mechanism. */
    .lbl { font-family: Georgia, 'Times New Roman', serif; font-size: 21px; fill: #B25C82; }
    .cat { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 2.4px;
           text-transform: uppercase; fill: #B25C82; opacity: 0.6; }
  </style>

  <rect width="400" height="500" fill="url(#wash)"/>
  <rect width="400" height="500" filter="url(#g)" opacity="0.05"/>

  <!-- A puff-stitch scallop along the bottom, the same motif the site uses. -->
  <path d="M0 500 a10 12 0 0 1 20 0 M20 500 a10 12 0 0 1 20 0 M40 500 a10 12 0 0 1 20 0 M60 500 a10 12 0 0 1 20 0 M80 500 a10 12 0 0 1 20 0 M100 500 a10 12 0 0 1 20 0 M120 500 a10 12 0 0 1 20 0 M140 500 a10 12 0 0 1 20 0 M160 500 a10 12 0 0 1 20 0 M180 500 a10 12 0 0 1 20 0 M200 500 a10 12 0 0 1 20 0 M220 500 a10 12 0 0 1 20 0 M240 500 a10 12 0 0 1 20 0 M260 500 a10 12 0 0 1 20 0 M280 500 a10 12 0 0 1 20 0 M300 500 a10 12 0 0 1 20 0 M320 500 a10 12 0 0 1 20 0 M340 500 a10 12 0 0 1 20 0 M360 500 a10 12 0 0 1 20 0 M380 500 a10 12 0 0 1 20 0" fill="none" stroke="#B25C82" stroke-width="2" opacity="0.35"/>

  
    <g fill="none" stroke="#B25C82" stroke-width="3.4" stroke-linecap="round">
      <circle cx="200" cy="250" r="62" />
      <path d="M148 236 Q200 198 252 236" />
      <path d="M148 264 Q200 302 252 264" />
      <path d="M200 188 L200 186" />
      <path d="M186 190 q-8 4 -4 12 q4 8 12 4" />
    </g>

  <g>
      <text x="200" y="404" text-anchor="middle" class="lbl">Two-tone heart</text>
      <text x="200" y="434" text-anchor="middle" class="lbl">keychain</text>
      <text x="200" y="472" text-anchor="middle" class="cat">keychains</text>
  </g>
</svg>
