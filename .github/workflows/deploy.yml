name: Deploy storefront to GitHub Pages

# The storefront is a fully static build, so this needs no server, no
# secrets and no database. It renders from the committed snapshot in
# apps/web/src/data/catalog.json, which means a green build never depends on
# the API being up.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'shared/**'
      - package.json
      - bun.lock
      - '.github/workflows/deploy.yml'
  # Lets you re-run a deploy without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one that is mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # No PUBLIC_API_URL here on purpose: the site builds from the snapshot.
      # Add it as a repository secret if you want each deploy to pull the
      # live catalogue at build time — the API must be reachable from the
      # runner, and the storefront origin must be in its trusted origins.
      - name: Build
        run: bun run --cwd apps/web build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
